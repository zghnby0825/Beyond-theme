    - { click: backspace, width: 15, name: backspace, swipe_up: function_keyboard_clearAll, swipe_down: function_keyboard_undo}
    #4
    - { click: eisu_toggle_符_symbols, swipe_up: eisu_toggle_更多_dotSymbols_kb, name: symbols, preview: false, width: 15 }
    - { click: eisu_toggle_123_number, name: numberPeriodFull, width: 10 }  
    - { click: text_halfcomma, swipe_up: ".", long_click: [ "，",  "。", "！", "？", "：", "@", "……", "`" ], preview: false, width: 8 }
    - { click: space, double_click: "。", width: 34, name: space ,preview: false }
