# default settings
# encoding: utf-8

style:
  __include: ./../public/style/default:/style
preset_styles:
  __include: ./../public/preset_styles/default:/preset_styles
preset_candidates:
  __include: ./../public/preset_candidates/default:/preset_candidates
preset_fonts:
  __include: ./../public/preset_fonts/default:/preset_fonts
preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./../public/preset_keys/default:/preset_keys


#自定义，主要变化label
  eisu_toggle_更多_dotSymbols_kb: { icon: "character_square.svg", label: "更多符", send: Eisu_toggle, select: .symbols }
  function_keyboard_clearAll_XX: { icon: "clean.svg", label: "×", send: function, command: keyboard.clearAll, option: "" }
  eisu_toggle_emoji_kb: { type: command, icon: "face_laughing.svg", label: "emoji", send: Eisu_toggle, select: .emoji, option: [] }
#官方，主要变化label
  eisu_toggle_123_number: { label: "数", send: Eisu_toggle, select: number }

# 恢复默认方案（wanxiang + schema）
  eisu_toggle_schema_wanxiang: { icon: "textformat.svg", label: "ABC", send: Eisu_toggle, select: wanxiang, option: schema }
# 组合：返回+wanxiang方案
  eisu_toggle_en_zh_default_schema_wanxiang: { icon: "keyboard_badge_globe.svg", label: "Zh", text: "{eisu_toggle_返回_default}{eisu_toggle_schema_wanxiang}" }

  # 切到 wanxiang_english 方案（schema）
  eisu_toggle_schema_wanxiang_english: { icon: "textformat.svg", label: "ABC", send: Eisu_toggle, select: wanxiang_english, option: schema }
# 组合：english + wanxiang_english 方案
  eisu_toggle_ABC_english_schema_wanxiang_english: { icon: "keyboard_badge_globe.svg", label: "万象-En", text: "{eisu_toggle_ABC_english}{eisu_toggle_schema_wanxiang_english}" }

# 切回主键盘 default（Zh）
  eisu_toggle_Zh_default: { label: "中", send: Eisu_toggle, select: default }
# 切到英文键盘页 english（En）
  eisu_toggle_ABC_english: { label: "英", send: Eisu_toggle, select: english}

  eisu_toggle_符_symbols: {label: "符", send: Eisu_toggle, select: symbols }
  participle: { icon: "textformat.svg", label: "'", send: "'" } # 分词
  text_halfcomma: { label: ",", text: "{,}", name: text_halfcomma }

#自定义按钮
  send_Fancha: { label: "`", send: "`" } #小鹤音形反查
  send_half_slash: { label: "/", send: "/" }
  send_fanxie: { label: '\', send: '\' }
  text_Control_Delete: { label: "Ctrl+Del", text: "{Control+Delete}" }
  text_Tab: { label: "tab", text: "{Tab}" } # 模拟tab健
  text_Tab_1: { label: "tab", text: "	" } # 直接输入tab符号


  eisu_toggle_tool: {
    label: "tool",
    send: Eisu_toggle,
    select: _setting_board,
    option: [
      function_keyboard_selectAll,
      function_keyboard_cut,
      function_keyboard_copy,
      function_keyboard_paste,
      function_keyboard_selectAllCut,
      function_keyboard_selectAllCopy,
      function_keyboard_clearAll,
      function_keyboard_rebuildTheme,
    ]
  }


  Control_T: { label: "Ctrl+T", text: "{Control+t}" }
  Control_A: { label: "Ctrl+A", text: "{Control+a}" }
  Control_B: { label: "Ctrl+B", text: "{Control+b}" }
  Control_C: { label: "Ctrl+C", text: "{Control+c}" }
  Control_D: { label: "Ctrl+D", text: "{Control+b}" }
  Control_F: { label: "Ctrl+F", text: "{Control+f}" }
  Control_S: { label: "Ctrl+S", text: "{Control+s}" }
  Control_E: { label: "Ctrl+E", text: "{Control+e}" }
  Control_H: { label: "Ctrl+H", text: "{Control+h}" }
  Control_I: { label: "Ctrl+I", text: "{Control+i}" }
  Control_J: { label: "Ctrl+J", text: "{Control+j}" }
  Control_K: { label: "Ctrl+K", text: "{Control+k}" }
  Control_L: { label: "Ctrl+L", text: "{Control+l}" }
  Control_M: { label: "Ctrl+M", text: "{Control+m}" }
  Control_N: { label: "Ctrl+N", text: "{Control+n}" }
  Control_P: { label: "Ctrl+P", text: "{Control+p}" }
  Control_G: { label: "Ctrl+G", text: "{Control+g}" }
  Control_O: { label: "Ctrl+O", text: "{Control+o}" }
  Control_P: { label: "Ctrl+P", text: "{Control+p}" }
  Control_Q: { label: "Ctrl+Q", text: "{Control+q}" }
  Control_R: { label: "Ctrl+R", text: "{Control+r}" }
  Control_U: { label: "Ctrl+U", text: "{Control+u}" }
  Control_V: { label: "Ctrl+V", text: "{Control+v}" }
  Control_W: { label: "Ctrl+W", text: "{Control+w}" }
  Control_X: { label: "Ctrl+X", text: "{Control+x}" }
  Control_Y: { label: "Ctrl+Y", text: "{Control+y}" }
  Control_Z: { label: "Ctrl+Z", text: "{Control+z}" }
  Key_Esc: { label: "Esc", text: "{Escape}" }

#键盘布局
preset_keyboards:
  default:
    ascii_mode: 0
    width: 10
    height: 40
    height_land: 30
    horizontal_gap: 6
    vertical_gap: 10
    vertical_gap_land: 4
    round_corner: 8
    key_text_offset_x: 0
    key_text_offset_y: 4
    key_press_text_offset_x: 0
    key_press_text_offset_y: 0
    key_upper_press_text_offset_x: 0
    key_upper_press_text_offset_y: 0
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 5
    key_down_text_offset_x: 0
    key_down_text_offset_y: -1
    key_down_press_text_offset_x: 0
    key_down_press_text_offset_y: 0
    preview_round_corner: 8
    long_preview_round_corner: 8
    long_preview_padding: 0
    long_preview_margin: 4
    preview: true
    shadow: { radius: 0.1, offsetX: 0, offsetY: 1.2, color: "#90949C" }
    keys:
    #0
    - { click: 1, label: 1, long_click: [ send_Fancha, Key_Esc ], height: 32 }
    - { click: 2, label: 2, long_click: [ text_Tab_1 ], height: 32 }
    - { click: 3, label: 3, height: 32 }
    - { click: 4, label: 4, height: 32 }
    - { click: 5, label: 5, height: 32 }
    - { click: 6, label: 6, height: 32 }
    - { click: 7, label: 7, height: 32 }
    - { click: 8, label: 8, height: 32 }
    - { click: 9, label: 9, height: 32 }
    - { click: 0, label: 0, height: 32 }
    # 1
    - { click: q, swipe_up: "%", long_click: [ "%", commit_q, commit_Q ] }
    - { click: w, swipe_up: "+", long_click: [ commit_w, "+", commit_W ] }
    - { click: e, swipe_up: "*", long_click: [ commit_e, "*", commit_E ] }
    - { click: r, swipe_up: "&", long_click: [ commit_r, "&", commit_R ] }
    - { click: t, swipe_up: "±", long_click: [ commit_t, "±", commit_T ] }
    - { click: y, swipe_up: "×", long_click: [ commit_y, "×", commit_Y ] }
    - { click: u, swipe_up: '\', long_click: [ commit_u, '\', commit_U ] }
    - { click: i, swipe_up: "¥", long_click: [ commit_i, "¥", commit_I ] }
    - { click: o, swipe_up: "°", long_click: [ commit_o, "°", commit_O ] }
    - { click: p, swipe_up: "$", long_click: [ commit_p, commit_P, "$" ] }
    - { width: 5 }
    #2
    - { click: a, swipe_up: "~", long_click: [ commit_a, commit_fulltilde, commit_A ] }
    - { click: s, swipe_up: "/", long_click: [ commit_s, commit_halfslash, commit_S ] }
    - { click: d, swipe_up: ":", long_click: [ commit_d, commit_fullcolon, commit_D ] }
    - { click: f, swipe_up: ";", long_click: [ commit_f, commit_fullsemicolon, commit_F ] }
    - { click: g, swipe_up: "(", swipe_down: eisu_toggle_tool, long_click: [ commit_g, text_halfbracket_left, commit_G ] }
    - { click: h, swipe_up: ")", long_click: [ commit_h, commit_half_rightparen, commit_H ] }
    - { click: j, swipe_up: "@", long_click: [ commit_j, commit_halfat, commit_J ] }
    - { click: k, swipe_up: '"', long_click: [ commit_k, text_fullquotationmark_left, commit_K ] }
    - { click: l, swipe_up: "'", long_click: [ commit_l, commit_halfquote, commit_L ] }
    - { width: 5 }
    #3
    - __include: ./themes_data/bottom_func_keys:/bottom_shift_key
      width: 15
      preview: false
      has_menu: text_delimiter
      name: shift
    - { click: z, swipe_up: "-", long_click: [ commit_z, commit_halfminus, commit_Z ] }
    - { click: x, swipe_up: "_", long_click: [ commit_x, commit_halfunderline, commit_X ] }
    - { click: c, swipe_up: "#", long_click: [ commit_c, commit_halfpoundsign, commit_C ] }
    - { click: v, swipe_up: "?", long_click: [ commit_v, commit_fullquestionmark, commit_V ] }
    - { click: b, swipe_up: "!", long_click: [ commit_b, commit_fullexclamationpoint, commit_B ] }
    - { click: n, swipe_up: "=", long_click: [ commit_n, "=", commit_N ] }
    - { click: m, swipe_up: "…", long_click: [ commit_m, "…", commit_M ] }
    - { click: backspace, width: 15, name: backspace, preview: false, swipe_up: function_keyboard_clearAll, swipe_down: function_keyboard_undo}
    #4
    - __include: ./themes_data/bottom_func_keys:/bottom_eisu_toggle_symbols_key
      width: 15
      name: symbols
      swipe_up: eisu_toggle_更多_dotSymbols_kb
      swipe_down: text_Control_Delete
      long_click: eisu_toggle_setting
      preview: false
    - { click: eisu_toggle_123_number, name: numberPeriodFull, width: 10 }  
    - { click: text_halfcomma, swipe_up: ".", long_click: [ "，",  "。", "！", "？", "：", "@", "……", "`" ], preview: false, width: 8 }
    - { click: space, double_click: "。", width: 34, name: space ,preview: false }
    - { click: send_half_slash, width: 8, name: slash, preview: false}
    - __include: ./themes_data/bottom_func_keys:/bottom_Ch_En_key
      width: 10
      name: Ch_En
      long_click: [eisu_toggle_common_setting_board, eisu_toggle_ABC_english_schema_wanxiang_english, function_rime_switcher]
      preview: false
    - { click: return, width: 15, name: return, swipe_up: select_second, composing: confirm, long_click: [function_keyboard_clearAll, function_keyboard_clearLeft, function_keyboard_clearRight, function_keyboard_undo, function_keyboard_redo, next], rect_preview: true, preview: false }


  english:
    ascii_mode: 1
    lock: true
    name: english_keyboard
    keys:
    #0
    - { click: 1, label: 1, height: 32  }
