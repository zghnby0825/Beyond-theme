    - { click: y, label: "Y", swipe_up: "6", swipe_down: "×", long_click: [ commit_y, "6", commit_Y ] }
    - { click: u, label: "U", swipe_up: "7", swipe_down: '\', long_click: [ commit_u, "7", commit_U ] }
    - { click: i, label: "I", swipe_up: "8", swipe_down: "¥", long_click: [ commit_i, "8", commit_I ] }
    - { click: o, label: "O", swipe_up: "9", swipe_down: "°", long_click: [ commit_o, "9", commit_O ] }
    - { click: p, label: "P", swipe_up: "0", swipe_down: "$", long_click: [ commit_p, commit_P, "0" ] }
    - { width: 5 }
    #2
    - { click: a, label: "A", swipe_up: "~", long_click: [ commit_a, commit_fulltilde, commit_A ] }
    - { click: s, label: "S", swipe_up: "/", long_click: [ commit_s, commit_halfslash, commit_S ] }
    - { click: d, label: "D", swipe_up: ":", long_click: [ commit_d, commit_fullcolon, commit_D ] }
    - { click: f, label: "F", swipe_up: ";", long_click: [ commit_f, commit_fullsemicolon, commit_F ] }
    - { click: g, label: "G", swipe_up: "(", swipe_down: eisu_toggle_tool, long_click: [ commit_g, text_halfbracket_left, commit_G ] }
    - { click: h, label: "H", swipe_up: ")", long_click: [ commit_h, commit_half_rightparen, commit_H ] }
    - { click: j, label: "J", swipe_up: "@", long_click: [ commit_j, commit_halfat, commit_J ] }
    - { click: k, label: "K", swipe_up: '"', long_click: [ commit_k, text_fullquotationmark_left, commit_K ] }
    - { click: l, label: "L", swipe_up: "'", long_click: [ commit_l, commit_halfquote, commit_L ] }
    - { width: 5 }
    #3
    - { click: shift, width: 15, name: shift }
    - { click: z, label: "Z", swipe_up: "-", long_click: [ commit_z, commit_halfminus, commit_Z ] }
    - { click: x, label: "X", swipe_up: "_", long_click: [ commit_x, commit_halfunderline, commit_X ] }
    - { click: c, label: "C", swipe_up: "#", long_click: [ commit_c, commit_halfpoundsign, commit_C ] }
    - { click: v, label: "V", swipe_up: "?", long_click: [ commit_v, commit_fullquestionmark, commit_V ] }
    - { click: b, label: "B", swipe_up: "!", long_click: [ commit_b, commit_fullexclamationpoint, commit_B ] }
    - { click: n, label: "N", swipe_up: "=", long_click: [ commit_n, "=", commit_N ] }
    - { click: m, label: "M", swipe_up: "…", long_click: [ commit_m, "…", commit_M ] }
    - { click: backspace, width: 15, name: backspace, preview: false, swipe_up: function_keyboard_clearAll, swipe_down: function_keyboard_undo}
    #4
    - { click: eisu_toggle_符_symbols, swipe_up: eisu_toggle_更多_dotSymbols_kb,  long_click: [ eisu_toggle_common_setting_board, function_rime_switcher ], name: symbols, preview: false, width: 20 }
    - { click: commit_fullcomma, swipe_up: ".", long_click: [ "，",  "。", "！", "？", "：", "@", "……", send_Fancha ], preview: false, width: 10 }
    - { click: space, double_click: "。", width: 40, name: space ,preview: false }
    - { click: eisu_toggle_zh_en_default_schema_wanxiang_english, width: 10, name: ABC ,preview: false }
    - { click: return, width: 20, name: return, swipe_up: eisu_toggle_clip_board, composing: confirm, long_click: [function_keyboard_clearAll, function_keyboard_clearLeft, function_keyboard_clearRight, function_keyboard_undo, function_keyboard_redo, next], rect_preview: true, preview: false }

