# default settings
# encoding: utf-8

style:
  __include: ./../public/style/default:/style
preset_styles:
  __include: ./../public/preset_styles/default:/preset_styles
preset_candidates:
  __include: ./../public/preset_candidates/default:/preset_candidates
preset_fonts:
  __include: ./../public/preset_fonts/default:/preset_fonts
preset_color_schemes:
  __include: ./../public/preset_color_schemes/default:/preset_color_schemes
preset_keys:
  __include: ./../public/preset_keys/default:/preset_keys

# 自定义label主要变化label
  eisu_toggle_更多_dotSymbols_kb: { label: "更多符", send: Eisu_toggle, select: .symbols }
  eisu_toggle_clip_board: { type: command, label: "Board", send: Eisu_toggle, select: _clip_board }
  send_half_slash: { label: "/", send: "/" }
  text_halfcomma: { label: ",", text: "{,}", name: halfcomma }
  text_Control_Delete: { label: "Ctrl+Del", text: "{Control+Delete}" }
  eisu_toggle_符_symbols: {label: "?123", send: Eisu_toggle, select: symbols }

  # 切到 wanxiang_EN方案（schema）
  eisu_toggle_schema_wanxiang_english: { label: "E", send: Eisu_toggle, select: wanxiang_english, option: schema }
  # 切到英文键盘页 english（万/E）
  eisu_toggle_ABC_english_Wx: { label: "万/E", send: Eisu_toggle, select: english_Wx_keyboard }
  # 组合：万象英文+英文键盘
  eisu_toggle_zh_en_default_schema_wanxiang_english: { label: "万/E", text: "{eisu_toggle_schema_wanxiang_english}{eisu_toggle_ABC_english_Wx}" }
  # 切到 wanxiang方案（schema）
  eisu_toggle_schema_wanxiang: { label: "万", send: Eisu_toggle, select: wanxiang, option: schema }
  # 切到WX键盘页
  eisu_toggle_wx_keyboard: { label: "九/万", send: Eisu_toggle, select: wx_keyboard }
  # 组合：WX键盘页 + wanxiang方案
  eisu_toggle_wx_keyboard_schema_wanxiang: { label: "九/万", text: "{eisu_toggle_wx_keyboard}{eisu_toggle_schema_wanxiang}" }
  # 切到 wanxiang_T9 方案（schema）
  eisu_toggle_schema_wanxiang_t9: { label: "t9", send: Eisu_toggle, select: wanxiang_t9, option: schema }
  # 组合：英/中展示，动作同返回+默认方案（默认是T9所以这里是T9）
  eisu_toggle_en_zh_default_schema_default: { label: "E/九", text: "{eisu_toggle_返回_default}{eisu_toggle_schema_wanxiang_t9}" }

# 剪贴板（icon）
  eisu_toggle_clip_board_icon: { type: command, icon: "jt.svg", label: "剪切板", send: Eisu_toggle, select: _clip_board }
# 表情（icon）
  eisu_toggle_emoji_icon: { type: command, icon: "bq.svg", label: "emoji", send: Eisu_toggle, select: .emoji, option: [] }
# 语音（icon）
  function_common_speech_recognition_icon: { type: command, icon: "yy.svg", label: "语音识别", send: function, command: speech.start, option: "" } 
# 切回主键盘(icon)
  eisu_toggle_Zh_default_icon: { icon: "To_Zh.svg", label: "Zh", send: Eisu_toggle, select: default }
# 切到英文键盘页(icon)
  eisu_toggle_ABC_english_icon: { icon: "To_En.svg", label: "En", send: Eisu_toggle, select: english}

  eisu_toggle_tool: {
    label: "tool",
    send: Eisu_toggle,
    select: _setting_board,
    option: [
      function_keyboard_selectAll,
      function_keyboard_cut,
      function_keyboard_copy,
      function_keyboard_paste,
      function_keyboard_selectAllCut,
      function_keyboard_selectAllCopy,
      function_keyboard_clearAll,
      function_keyboard_rebuildTheme,
    ]
  }

preset_keyboards:
  __include: ./../public/preset_keyboards/default:/preset_keyboards

  default:
    ascii_mode: 0
    height_land: 34
    round_corner: 8
    key_text_offset_x: 0
    key_text_offset_y: 5
    key_press_text_offset_x: 0
    key_press_text_offset_y: 0
    key_upper_press_text_offset_x: 0
    key_upper_press_text_offset_y: 0
    key_upper_text_offset_x: 0
    key_upper_text_offset_y: 3
    key_down_text_offset_x: 0
    key_down_text_offset_y: -1
    key_down_press_text_offset_x: 0
    key_down_press_text_offset_y: 0
    preview_round_corner: 9
    long_preview_round_corner: 9
    long_preview_padding: 0
    long_preview_margin: 4
    shadow: { radius: 0, offsetX: 0, offsetY: 0, color: "#90949C" }
    horizontal_gap: 6
    vertical_gap: 10
    vertical_gap_land: 4
    name: default_t9_keyboard
    preview: false
    height: 46
    width: 22
    menu: { events: [
      function_common_speech_recognition_icon, # 语音识别
      eisu_toggle_emoji_icon,  # 表情选择器
      eisu_toggle_clip_board_icon,      # 打开剪切板
      eisu_toggle_ABC_english_icon      # 中英切换
      ] }    
    keys:
    #1
    - { collection: [ "，", "。", "？", "！", "~", "、", "；", "：", "@", "…", "'" ], width: 17, height: 162, height_land: 111, row_height: 39, row_height_land: 35, row_vertical_gap: 3, show_row_back_image: false, name: table }
    - __include: ./themes_data/t9_keys:/t9_key_1
      height: 50
      swipe_down: text_Control_Delete
      functional: false
    - { click: 2, label: 'ABC', height: 50, swipe_up: commit_2, long_click: [ commit_a, commit_b, commit_c, commit_2, commit_A, commit_B, commit_C ] }
    - { click: 3, label: 'DEF', swipe_up: commit_3, height: 50, long_click: [ commit_d, commit_e, commit_f, commit_3, commit_D, commit_E, commit_F ] }
    - { click: backspace, width: 17, height: 50, name: backspace, swipe_up: function_keyboard_clearLeft, swipe_down: function_keyboard_undo}

    #2
    - { width: 17 }
    - { click: 4, label: 'GHI', swipe_up: commit_4, height: 50, long_click: [ commit_g, commit_h, commit_i, commit_4, commit_G, commit_H, commit_I ] }
    - { click: 5, label: 'JKL', swipe_up: commit_5, swipe_down: eisu_toggle_tool, height: 50, long_click: [ commit_j, commit_k, commit_l, commit_5, commit_J, commit_K, commit_L ] }
    - { click: 6, label: 'MNO', swipe_up: commit_6, height: 50, long_click: [ commit_m, commit_n, commit_o, commit_6, commit_M, commit_N, commit_O ] }
    - { click: [ { send: next, when: normal }, 
      { send: function_rime_clear, when: composing }, 
      { send: function_candidate_select_first, when: predicting }, 
      { send: function_keyboard_paste, when: pasting }, 
      { send: function_keyboard_copy, when: selecting } ], 
      height: 50, 
      long_click: [ function_keyboard_selectAll, function_keyboard_cut, function_keyboard_copy, function_keyboard_paste ], 
      swipe_up: commit_0, 
      name: dot, 
      width: 17 }
    #3
    - { width: 17 }
    - { click: 7, label: 'PQRS', swipe_up: commit_7, height: 50, long_click: [ commit_p, commit_q, commit_r, commit_s, commit_7, commit_P, commit_Q, commit_R, commit_S ] }
    - { click: 8, label: 'TUV', swipe_up: commit_8, height: 50, long_click: [ commit_t, commit_u, commit_v, commit_8, commit_T, commit_U, commit_V ] }
    - { click: 9, label: 'WXYZ', swipe_up: commit_9, height: 50, long_click: [ commit_w, commit_x, commit_y, commit_z, commit_9, commit_W, commit_X, commit_Y, commit_Z ] }
    - { click: return, name: return, width: 17, height: 102, height_land: 73, composing: confirm, 
      long_click: [function_keyboard_clearAll, function_keyboard_clearLeft, function_keyboard_clearRight,  function_keyboard_undo, function_keyboard_redo, next] }
    #4
    - { click: eisu_toggle_符_dotsymbols, width: 17, height: 46, name: default_symbols }
    - __include: ./themes_data/bottom_func_keys:/bottom_123_key
      width: 12
      height: 46
      name: 123_key
      swipe_down: eisu_toggle_toolbar_customize
    - { click: space, swipe_up: eisu_toggle_ABC_english, double_click: [{ send: "。", when: composing }], name: space, width: 42, height: 46 }
    - { click: eisu_toggle_wx_keyboard_schema_wanxiang,long_click: [eisu_toggle_common_setting_board, send_half_slash, function_rime_switcher], width: 12, height: 46 }

